<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="appTitle">SubMovies - AI Subtitle Translator</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/css/main.css">
    <script type="module" src="src/js/main.js" defer></script>
</head>

<body>
    <div class="app-shell">
        <header class="top-bar">
            <div class="top-bar-brand">
                <img src="favicon.svg" alt="" />
                <span>SubMovies</span>
            </div>
            <div class="top-bar-spacer"></div>
            <div class="top-bar-actions">
                <button id="languageSelectBtn" class="lang-btn"></button>
                <button id="titleThemeToggleContainer" class="theme-toggle" aria-label="Toggle theme">
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="4"></circle>
                        <line x1="12" y1="2" x2="12" y2="4"></line>
                        <line x1="12" y1="20" x2="12" y2="22"></line>
                        <line x1="4.2" y1="4.2" x2="5.6" y2="5.6"></line>
                        <line x1="18.4" y1="18.4" x2="19.8" y2="19.8"></line>
                        <line x1="2" y1="12" x2="4" y2="12"></line>
                        <line x1="20" y1="12" x2="22" y2="12"></line>
                        <line x1="4.2" y1="19.8" x2="5.6" y2="18.4"></line>
                        <line x1="18.4" y1="5.6" x2="19.8" y2="4.2"></line>
                    </svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20.5 14.5c-1 .3-2 .5-3 .5-5 0-9-4-9-9 0-1 .2-2 .5-3-4 1-7 4.5-7 8.7C2 16.7 6.3 21 11.3 21c4.2 0 7.7-3 8.7-7 .1-.2.1-.3.5-.5z"></path>
                    </svg>
                </button>
            </div>
        </header>

        <div class="layout page-enter">
            <div class="hero-copy">
                <h1 id="appTitleH1" data-i18n="appHeaderTitle"></h1>
                <p data-i18n="appSubtitle"></p>
            </div>

            <main class="workspace">
                <section class="card" id="settingsCard">

                    <div id="aiSettingsSection" class="field-group">
                        <div class="field">
                            <div class="relative group w-max">
                                <label for="apiKeyInput" class="field-label"><span class="field-icon" role="img" aria-label="key">🔑</span> <span data-i18n="apiKeyLabel"></span>&nbsp;<span id="apiKeyProviderTag" style="opacity:0.7; font-weight:normal;"></span></label>
                                <div class="tooltip-bubble" data-i18n-tooltip="apiKeyTooltip"></div>
                            </div>
                            <input id="apiKeyInput" type="password" data-i18n-placeholder="apiKeyPlaceholder" />
                            <div class="toggle-row">
                                <input type="checkbox" id="saveApiKeyCheckbox">
                                <div class="relative group" style="flex:1 1 auto;">
                                    <label for="saveApiKeyCheckbox" class="field-label" data-i18n="saveApiKeyLabel" style="font-weight:normal;"></label>
                                    <div class="tooltip-bubble" data-i18n-tooltip="saveApiKeyTooltip"></div>
                                </div>
                            </div>
                        </div>

                        <div class="field-row two-col">
                            <div class="field">
                                <div class="relative group w-max">
                                    <label for="modelSelectBtn" class="field-label"><span class="field-icon" role="img" aria-label="brain">🧠</span> <span data-i18n="modelLabel"></span></label>
                                    <div class="tooltip-bubble" data-i18n-tooltip="modelTooltip"></div>
                                </div>
                                <button id="modelSelectBtn" class="modal-trigger-btn"></button>
                            </div>
                            <div class="field">
                                <div class="relative group w-max">
                                    <label for="temperatureInput" class="field-label" data-i18n="temperatureLabel"></label>
                                    <div class="tooltip-bubble" data-i18n-tooltip="temperatureTooltip"></div>
                                </div>
                                <input type="range" id="temperatureInput" min="0" max="1" step="0.1" value="0.7">
                                <div class="hint-text" id="temperatureValueDisplay" style="text-align:center;">0.7</div>
                            </div>
                        </div>

                        <div class="field-row two-col">
                            <div class="field">
                                <div class="relative group w-max">
                                    <label for="toneSelectBtn" class="field-label"><span class="field-icon" role="img" aria-label="microphone">🎤</span> <span data-i18n="toneLabel"></span></label>
                                    <div class="tooltip-bubble" data-i18n-tooltip="toneTooltip"></div>
                                </div>
                                <button id="toneSelectBtn" class="modal-trigger-btn"></button>
                            </div>
                            <div class="field">
                                <div class="relative group w-max">
                                    <label for="langTargetSelectBtn" class="field-label"><span class="field-icon" role="img" aria-label="globe">🌍</span> <span data-i18n="langTargetLabel"></span></label>
                                    <div class="tooltip-bubble" data-i18n-tooltip="targetLangTooltip"></div>
                                </div>
                                <button id="langTargetSelectBtn" class="modal-trigger-btn"></button>
                            </div>
                        </div>

                        <div class="field">
                            <div class="relative group w-max">
                                <label for="customPromptInput" class="field-label"><span class="field-icon" role="img" aria-label="pencil note">📝</span> <span data-i18n="customPromptLabel"></span></label>
                                <div class="tooltip-bubble" data-i18n-tooltip="customPromptTooltip"></div>
                            </div>
                            <textarea id="customPromptInput" style="min-height: 4.5rem;" data-i18n-placeholder="customPromptPlaceholder"></textarea>
                        </div>

                        <hr class="section-divider" />

                        <div class="field">
                            <div class="relative group w-max">
                                <label for="chunkSizeSelectBtn" class="field-label"><span class="field-icon" role="img" aria-label="gauge">📊</span> <span data-i18n="chunkSizeLabel"></span></label>
                                <div class="tooltip-bubble" data-i18n-tooltip="chunkSizeTooltip"></div>
                            </div>
                            <button id="chunkSizeSelectBtn" class="modal-trigger-btn"></button>
                        </div>

                        <div class="field-row two-col">
                            <div class="field">
                                <div class="relative group w-max">
                                    <label for="rateLimitSelectBtn" class="field-label"><span class="field-icon" role="img" aria-label="hourglass">⏳</span> <span data-i18n="rateLimitLabel"></span></label>
                                    <div class="tooltip-bubble" data-i18n-tooltip="rateLimitTooltip"></div>
                                </div>
                                <button id="rateLimitSelectBtn" class="modal-trigger-btn"></button>
                            </div>
                            <div class="field" style="justify-content:flex-end;">
                                <div class="toggle-row">
                                    <input type="checkbox" id="postProcessToggle">
                                    <div class="relative group" style="flex:1 1 auto;">
                                        <label for="postProcessToggle" class="field-label" data-i18n="postProcessLabel" style="font-weight:normal;"></label>
                                        <div class="tooltip-bubble" data-i18n-tooltip="postProcessTooltip"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- /#aiSettingsSection -->

                    <hr class="section-divider" />

                    <div class="toggle-row">
                        <input type="checkbox" id="manualModeToggle">
                        <div class="relative group" style="flex:1 1 auto;">
                            <label for="manualModeToggle" class="field-label" data-i18n="manualModeLabel"></label>
                            <div class="tooltip-bubble" data-i18n-tooltip="manualModeTooltip"></div>
                        </div>
                    </div>

                    <div class="field">
                        <div class="relative group w-max">
                            <label for="fileInput" class="field-label">
                                <span class="field-icon" role="img" aria-label="upload">📤</span> <span data-i18n="fileChooseLabel"></span>
                            </label>
                            <div class="tooltip-bubble" data-i18n-tooltip="uploadFileTooltip"></div>
                        </div>
                        <label class="custom-file-upload">
                            <input id="fileInput" type="file" accept=".srt,.vtt,.ass,.ssa" style="display:none;" />
                            <span class="upload-zone">
                                <span role="img" aria-label="upload">📤</span>
                                <span id="fileInputButtonText" data-i18n="fileChooseButtonText"></span>
                            </span>
                        </label>
                        <div id="fileNameText" class="hint-text"></div>
                        <p class="hint-text" data-i18n="assFormatNote"></p>
                    </div>

                    <div class="field">
                        <div class="relative group w-max">
                            <label for="filenameInput" class="field-label"><span class="field-icon" role="img" aria-label="label">🏷️</span> <span data-i18n="filenameLabel"></span></label>
                            <div class="tooltip-bubble" data-i18n-tooltip="outputFileNameTooltip"></div>
                        </div>
                        <input type="text" id="filenameInput" dir="ltr" style="unicode-bidi: plaintext; text-align: start;" data-i18n-placeholder="filenamePlaceholder" />
                    </div>

                    <div class="field">
                        <textarea id="promptInput" style="min-height: 10rem;" dir="ltr" data-i18n-placeholder="promptPlaceholder"></textarea>
                        <div class="status-row"><span></span><span id="charCountDisplay"></span></div>
                    </div>

                    <div class="action-bar">
                        <button id="translateBtn" class="btn"></button>
                        <button id="stopBtn" class="btn btn-danger" data-i18n="stopBtn" style="display: none;"></button>
                    </div>

                    <div id="progressBarContainer" class="progress-wrap" style="display:none;">
                        <div class="progress-bar-track">
                            <div id="progressBarFill" class="progress-bar-fill" style="width:0%;"></div>
                        </div>
                        <div id="progressBarText" class="progress-bar-text"></div>
                    </div>

                    <div id="manualEditorSection" class="field-group" style="display:none;">
                        <h3 class="manual-editor-heading" data-i18n="manualEditorTitle"></h3>
                        <p id="manualEditorEmptyHint" class="hint-text" data-i18n="manualEditorEmptyHint"></p>
                        <div id="manualEditorRows" class="manual-editor-rows"></div>
                        <p class="hint-text" data-i18n="manualAutoSaveHint"></p>
                        <button id="manualDownloadBtn" class="btn" data-i18n="manualDownloadBtn" style="display:none;"></button>
                    </div>

                    <div class="mobile-action-spacer"></div>
                </section>

                <section id="responseSection" class="card" style="display:none;">
                    <div class="status-row" style="font-size:inherit;">
                        <h2 id="responseTitle" style="margin:0; font-size:1.15rem; font-weight:700; color: var(--text-primary);" data-i18n="responseTitle"></h2>
                        <button id="copyTranslatedBtn" class="btn-secondary" style="display:none;">
                            <span role="img" aria-label="copy">📋</span> <span data-i18n="copyBtnText"></span>
                        </button>
                    </div>
                    <div id="responseBox"></div>
                    <button id="downloadBtn" style="display:none" class="btn" data-i18n="downloadBtn"></button>
                </section>
            </main>
        </div>

        <footer class="app-footer">
            <p><span data-i18n="footerMadeWith"></span> ❤️ <span data-i18n="footerBy"></span> <a href="https://github.com/GeekNeuron/SubMovies" data-i18n="footerAuthor">GeekNeuron</a></p>
            <p id="appVersionText" class="version"></p>
        </footer>
    </div>

    <div id="optionsModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Select an Option</h3>
                <button id="modalCloseBtn" class="modal-close-btn">&times;</button>
            </div>
            <div id="modalOptionsContainer" class="modal-options-container"></div>
        </div>
    </div>
</body>
</html>
